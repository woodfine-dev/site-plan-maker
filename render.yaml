# Render Blueprint: in the Render dashboard, New > Blueprint, and pick this repository.
services:
  - type: web
    name: site-plan-maker
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    headers:
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
